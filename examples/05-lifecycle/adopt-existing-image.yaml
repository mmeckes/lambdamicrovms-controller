# Adopting an existing MicroVM image.
#
# Adoption brings an image that already exists in AWS under the controller's
# management, without recreating it. Use it when migrating from CLI or
# CloudFormation-managed images to ACK, or when reattaching after a custom
# resource was deleted under a `retain` policy.
#
# Two annotations do the work:
#
#   services.k8s.aws/adoption-policy
#     adopt-or-create : adopt if it exists, create it otherwise. Best for GitOps,
#                       where the same manifest should work on a fresh account
#     adopt           : adopt if it exists, otherwise fail with
#                       AdoptedResourceNotFound. Best when you want an explicit
#                       error rather than accidentally creating something in the
#                       wrong account
#
#     These two are the only accepted values; the runtime rejects anything else.
#
#   services.k8s.aws/adoption-fields
#     A JSON object identifying the existing resource. Note it is a JSON STRING,
#     so it must be quoted in YAML.
#
#     For this resource the object must contain "arn", and nothing else is
#     accepted. PopulateResourceFromAnnotation reads only "arn", so identifying
#     the image by "name" fails immediately with
#       ACK.Terminal: Error populating adoption fields: required field missing: arn
#
# Requires the ResourceAdoption feature gate, which the chart enables by default.
#
# The deletion-policy: retain annotation is strongly recommended alongside
# adoption: having just taken ownership of a pre-existing resource, you almost
# certainly do not want an accidental `kubectl delete` to destroy it.
apiVersion: lambdamicrovms.services.k8s.aws/v1alpha1
kind: MicrovmImage
metadata:
  name: adopted-image
  annotations:
    services.k8s.aws/adoption-policy: adopt-or-create
    # Identify the existing image by ARN. Quoted, because the value is JSON.
    # Replace the account ID and image name with the image you are adopting.
    services.k8s.aws/adoption-fields: '{"arn": "arn:aws:lambda:us-east-1:123456789012:microvm-image:existing-image"}'
    services.k8s.aws/deletion-policy: retain
spec:
  # Must match the existing image's name. This is the immutable primary key the
  # controller uses to find it.
  name: existing-image

  # With adopt-or-create these are also the values used if the image turns out
  # not to exist and has to be created. On adoption the controller reads the
  # live resource and patches spec from it, so expect these to be overwritten by
  # whatever AWS reports.
  baseImageARN: arn:aws:lambda:us-east-1:aws:microvm-image:al2023-1
  codeArtifact:
    uri: s3://<your-bucket-name>/app.zip
  buildRoleRef:
    from:
      name: microvm-build-role
