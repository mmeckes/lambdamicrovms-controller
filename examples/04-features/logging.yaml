# Logging configuration.
#
# `logging` accepts exactly one of two forms: `cloudWatch` or `disabled`. The
# `disabled` form is an EMPTY MAP — `disabled: {}` — which is unusual enough to
# be worth demonstrating explicitly. It is generated from an empty API shape, so
# `disabled: true` is not valid.
#
# Both resources accept the same shape, but they do not cover the same logs. On
# a MicrovmImage, `logging` controls BUILD logs. It does not redirect what your
# application prints at run time: a MicroVM launched from an image whose
# `logging` names a group writes nothing to that group. For runtime logs, set
# `logging` on the Microvm itself (or pass it to RunMicrovm).
#
# Create the runtime log group first. A missing runtime log group is not
# auto-created and nothing reports the problem — RunMicrovm succeeds, the
# MicroVM serves traffic, and the logs are silently dropped. Build logs differ
# only because the build role here holds logs:CreateLogGroup and the execution
# role does not.
---
# Stream to a named CloudWatch log group.
apiVersion: lambdamicrovms.services.k8s.aws/v1alpha1
kind: MicrovmImage
metadata:
  name: logging-cloudwatch
spec:
  name: logging-cloudwatch
  baseImageARN: arn:aws:lambda:us-east-1:aws:microvm-image:al2023-1
  codeArtifact:
    uri: s3://<your-bucket-name>/app.zip
  buildRoleRef:
    from:
      name: microvm-build-role

  logging:
    cloudWatch:
      # BUILD logs only. If you omit `logging` entirely, build logs still land in
      # /aws/lambda-microvms/<image-name>. Set this to send them elsewhere, for
      # example a group with a retention policy you control.
      #
      # This does NOT affect runtime logs from MicroVMs launched from this image
      # — see 03-long-lived-microvm/microvm.yaml for where those are configured.
      logGroup: /aws/lambda/microvms/logging-cloudwatch
      # Optional. Omit to let the service choose a stream name per build.
      logStream: builds
---
# Turn logging off entirely. Note the empty map.
apiVersion: lambdamicrovms.services.k8s.aws/v1alpha1
kind: MicrovmImage
metadata:
  name: logging-disabled
spec:
  name: logging-disabled
  baseImageARN: arn:aws:lambda:us-east-1:aws:microvm-image:al2023-1
  codeArtifact:
    uri: s3://<your-bucket-name>/app.zip
  buildRoleRef:
    from:
      name: microvm-build-role

  logging:
    # Not `disabled: true`. An empty map.
    disabled: {}
